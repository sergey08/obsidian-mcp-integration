name: Obsidian MCP integration
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/obsidian_mcp/**'
      - 'docs/releases/**'
      - 'hacs.json'
      - 'README.md'
      - '.github/workflows/obsidian-mcp-integration.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/releases/**'
      - 'custom_components/obsidian_mcp/**'
      - 'tests/obsidian_mcp_integration_smoke.py'
      - 'hacs.json'
      - 'tools/obsidian_mcp_livesync/**'
      - '.github/workflows/obsidian-mcp-integration.yml'
  workflow_dispatch:
    inputs:
      publish_stable:
        description: Publish the validated stable version from main
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  smoke:
    name: Home Assistant ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.9.4"
            mcp: "1.26.0"
          - homeassistant: "2026.11.0"
            mcp: "2.3.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: >-
          python -m pip install
          'homeassistant==${{ matrix.homeassistant }}'
          'mcp==${{ matrix.mcp }}'
          'uvicorn==0.54.0'
      - run: python tests/obsidian_mcp_integration_smoke.py
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
  livesync:
    name: LiveSync in HA Core (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Build architecture-specific LiveSync runtime
        run: docker buildx build --output type=local,dest="$RUNNER_TEMP/livesync" tools/obsidian_mcp_livesync
      - name: Verify replication in the unmodified HA Core image
        run: bash tools/obsidian_mcp_livesync/smoke.sh "$RUNNER_TEMP/livesync"
      - name: Archive validated runtime
        run: |
          archive="livesync-ha-${{ matrix.arch }}.tar.gz"
          tar -czf "$archive" -C "$RUNNER_TEMP/livesync" bin livesync-runtime
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: livesync-ha-${{ matrix.arch }}
          path: livesync-ha-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error

  release:
    name: Publish stable release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_stable
    needs: [smoke, hassfest, hacs, livesync]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: obsidian-mcp-stable-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: livesync-ha-*
          path: assets
          merge-multiple: true
      - name: Publish stable release and verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest_version=$(jq -er .version custom_components/obsidian_mcp/manifest.json)
          if ! [[ "$manifest_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Stable release requires an x.y.z version in the integration manifest.'
            exit 1
          fi
          version="v$manifest_version"
          notes="docs/releases/$version.md"
          test -s "$notes"
          for arch in amd64 arm64; do
            (cd assets && sha256sum -c "livesync-ha-$arch.tar.gz.sha256")
          done
          gh release create "$version" assets/livesync-ha-*.tar.gz assets/livesync-ha-*.tar.gz.sha256 \
            --target "$GITHUB_SHA" --latest --title "Obsidian MCP $version" --notes-file "$notes"
